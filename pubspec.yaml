name: health_data_hub
description: Health Data Hub — Flutter UI assignment (pixel-close Figma replication).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  equatable: ^2.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/bg/
    - assets/images/heroes/
    - assets/images/organs/
    - assets/images/ui/
    - assets/images/vec/
